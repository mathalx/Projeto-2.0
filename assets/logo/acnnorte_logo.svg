<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210" role="img" aria-labelledby="acnnorteLogoTitle acnnorteLogoDesc">
  <title id="acnnorteLogoTitle">ACNnorte</title>
  <desc id="acnnorteLogoDesc">Logotipo ACNnorte: letras ACN em degradê azul, com a letra C em verde contendo a cruz de Segurança do Trabalho vazada no centro, e a palavra Norte em tipografia serifada grafite.</desc>

  <defs>
    <!-- Azul institucional: #1E3A8A -> #2563EB -->
    <linearGradient id="acnAzul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Verde institucional: #16A34A -> #22C55E -->
    <linearGradient id="acnVerde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Linha fina de interseção da marca -->
    <linearGradient id="acnLinha" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0"/>
      <stop offset="20%" stop-color="#1E3A8A" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#16A34A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <!-- Cruz de Segurança do Trabalho vazada no centro da letra C -->
    <mask id="acnCruzVazada" maskUnits="userSpaceOnUse" x="128" y="54" width="100" height="100">
      <rect x="128" y="54" width="100" height="100" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="172" y="76" width="12" height="56" rx="3"/>
        <rect x="150" y="98" width="56" height="12" rx="3"/>
        <rect x="214" y="95" width="26" height="18" rx="9"/>
      </g>
    </mask>
  </defs>

  <!-- Linha fina horizontal de interseção (passa suavemente pelo centro da marca) -->
  <line x1="16" y1="104" x2="504" y2="104" stroke="url(#acnLinha)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monograma ACN: letra C em verde com a cruz de segurança vazada -->
  <g font-family="'Segoe UI', 'Arial Black', Arial, Helvetica, sans-serif" font-weight="800" font-size="132">
    <text x="70" y="150" text-anchor="middle" fill="url(#acnAzul)">A</text>
    <circle cx="178" cy="104" r="44" fill="url(#acnVerde)" mask="url(#acnCruzVazada)"/>
    <text x="292" y="150" text-anchor="middle" fill="url(#acnAzul)">N</text>
  </g>

  <!-- Assinatura "Norte" -->
  <text x="354" y="156" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="58" letter-spacing="-0.5" fill="#1F2937">Norte</text>
</svg>
